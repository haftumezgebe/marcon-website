<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Inventory | Melazal Manufacturing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen font-sans">

    <header class="p-6 border-b border-white/10 glass-card sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-blue-500 uppercase tracking-tighter">Inventory System</h1>
                <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">Melazal Manufacturing Industry</p>
            </div>
            <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-white transition">← Main Portfolio</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 space-y-8">
        
        <div class="glass-card rounded-2xl overflow-hidden">
            <div class="p-6 border-b border-white/10 flex justify-between items-center">
                <h2 class="font-bold text-lg text-white">Workshop Stock List</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-800/50 text-xs uppercase tracking-widest text-slate-400">
                        <tr>
                            <th class="p-4">Material Name</th>
                            <th class="p-4">Specification</th>
                            <th class="p-4">Quantity</th>
                            <th class="p-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm divide-y divide-white/5">
                        <tr class="hover:bg-white/5 transition">
                            <td class="p-4 font-bold">Mild Steel Sheet</td>
                            <td class="p-4 text-slate-400">2.0mm x 1220 x 2440</td>
                            <td class="p-4 font-mono text-lg text-blue-400"><span id="stock-1">45</span> <span class="text-xs text-slate-500">Pcs</span></td>
                            <td class="p-4">
                                <button onclick="updateStock('stock-1', -1)" class="bg-red-500/20 text-red-500 hover:bg-red-500 hover:text-white px-3 py-1 rounded-md text-xs font-bold transition">Issue 1</button>
                                <button onclick="updateStock('stock-1', 1)" class="bg-green-500/20 text-green-500 hover:bg-green-500 hover:text-white px-3 py-1 rounded-md text-xs font-bold transition ml-2">Add 1</button>
                            </td>
                        </tr>
                        <tr class="hover:bg-white/5 transition">
                            <td class="p-4 font-bold">Square Tube</td>
                            <td class="p-4 text-slate-400">40mm x 40mm x 1.5mm</td>
                            <td class="p-4 font-mono text-lg text-blue-400"><span id="stock-2">12</span> <span class="text-xs text-slate-500">Pcs</span></td>
                            <td class="p-4">
                                <button onclick="updateStock('stock-2', -1)" class="bg-red-500/20 text-red-500 hover:bg-red-500 hover:text-white px-3 py-1 rounded-md text-xs font-bold transition">Issue 1</button>
                                <button onclick="updateStock('stock-2', 1)" class="bg-green-500/20 text-green-500 hover:bg-green-500 hover:text-white px-3 py-1 rounded-md text-xs font-bold transition ml-2">Add 1</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        function updateStock(id, change) {
            const stockElement = document.getElementById(id);
            let currentStock = parseInt(stockElement.innerText);
            let newStock = currentStock + change;

            if (newStock < 0) {
                alert("Insufficient Stock!");
            } else {
                stockElement.innerText = newStock;
                
                // Visual feedback for low stock
                if (newStock < 5) {
                    stockElement.parentElement.classList.replace('text-blue-400', 'text-red-500');
                } else {
                    stockElement.parentElement.classList.replace('text-red-500', 'text-blue-400');
                }
            }
        }
    </script>
</body>
</html>
